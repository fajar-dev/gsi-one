apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def localSigningProperties = new Properties()
def localSigningFile = rootProject.file('signing.properties')
if (localSigningFile.exists()) {
    localSigningFile.withInputStream { localSigningProperties.load(it) }
}
def releaseSigningValue = { name ->
    project.findProperty(name) ?: localSigningProperties.getProperty(name)
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.grahasurvei.gsisurvey"

    defaultConfig {
        applicationId "com.grahasurvei.gsisurvey"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 12
        versionName "3.1.0"
    }

    signingConfigs {
        debug {
            storeFile file(project.hasProperty('DEBUG_STORE_FILE') ? DEBUG_STORE_FILE : 'debug.keystore')
            storePassword project.hasProperty('DEBUG_STORE_PASSWORD') ? DEBUG_STORE_PASSWORD : 'android'
            keyAlias project.hasProperty('DEBUG_KEY_ALIAS') ? DEBUG_KEY_ALIAS : 'androiddebugkey'
            keyPassword project.hasProperty('DEBUG_KEY_PASSWORD') ? DEBUG_KEY_PASSWORD : 'android'
        }
        release {
            if (releaseSigningValue('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(releaseSigningValue('MYAPP_UPLOAD_STORE_FILE'))
                storePassword releaseSigningValue('MYAPP_UPLOAD_STORE_PASSWORD')
                keyAlias releaseSigningValue('MYAPP_UPLOAD_KEY_ALIAS')
                keyPassword releaseSigningValue('MYAPP_UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
