<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GSI One - React Native Web</title>
  <script>
    // Polyfill global variables for react-native compatibility on web
    if (typeof global === 'undefined') {
      window.global = window;
    }
    if (typeof exports === 'undefined') {
      window.exports = {};
    }
  </script>
  <style>
    #app-root { display: flex; flex-direction: column; }
    html, body { overflow: hidden; }
    /* RN Web modals render in a portal outside the application frame. */
    body [aria-modal="true"] {
      width: 100%;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }
    /* The native navigation tree needs a flex parent with a definite height. */
    html, body, #app-root {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #F8F9FA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body>
  <!-- Container target where App gets mounted -->
  <div id="app-root"></div>
</body>
</html>
