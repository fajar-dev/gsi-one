<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GSI One - React Native Web</title>
  <script>
    // Polyfill global variables for react-native compatibility on web
    if (typeof global === 'undefined') {
      window.global = window;
    }
    if (typeof exports === 'undefined') {
      window.exports = {};
    }
  </script>
  <style>
    /* Absolute full screen layout */
    html, body, #app-root {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body>
  <!-- Container target where App gets mounted -->
  <div id="app-root"></div>
</body>
</html>
