name: CI Quality Gate

on:
  push:
    branches: [main, master, dev, develop]
  pull_request:
    branches: [main, master, dev, develop]

permissions:
  contents: read

env:
  SUPABASE_URL: https://example.supabase.co
  SUPABASE_ANON_KEY: sb_publishable_ci_validation_only

jobs:
  quality:
    name: Architecture, types, lint, tests and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: npm run build:web

  android:
    name: Android debug compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --max-workers=2
        working-directory: android
